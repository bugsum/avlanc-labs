name: CI
on:
  pull_request:
    branches: [main, dev]
jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
      - run: npm ci
      - run: npm run lint
      - run: npm run build
